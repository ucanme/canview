<svg width="16" height="16" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变线条 -->
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9e9e9e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#757575" stop-opacity="1"/>
      <stop offset="100%" stop-color="#9e9e9e" stop-opacity="0.8"/>
    </linearGradient>

    <!-- 艺术化画笔效果 -->
    <filter id="sketchFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.01" numOctaves="2" result="turbulence"/>
      <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- 示波器屏幕 -->
  <rect x="20" y="20" width="160" height="160" rx="10" fill="#1a1a1a" stroke="#4a4a4a" stroke-width="3"/>

  <!-- 艺术化网格背景 -->
  <g stroke="#3a3a3a" stroke-width="0.5" opacity="0.4">
    <!-- 水平线 -->
    <line x1="20" y1="60" x2="180" y2="60"/>
    <line x1="20" y1="100" x2="180" y2="100"/>
    <line x1="20" y1="140" x2="180" y2="140"/>
    <!-- 垂直线 -->
    <line x1="60" y1="20" x2="60" y2="180"/>
    <line x1="100" y1="20" x2="100" y2="180"/>
    <line x1="140" y1="20" x2="140" y2="180"/>
  </g>

  <!-- 主要艺术波形 - 灵感来自信号回放 -->
  <path d="M30,100
           C40,60 50,60 60,60
           S80,80 90,140
           C100,160 110,160 120,120
           S130,80 140,100
           C150,120 160,120 170,80"
        fill="none" stroke="url(#lineGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#sketchFilter)"/>

  <!-- 次要波形 - 增添层次感 -->
  <path d="M30,110
           C40,80 50,80 60,80
           S75,100 85,130
           C95,150 105,150 115,110
           S130,90 140,110
           C150,130 160,130 170,100"
        fill="none" stroke="#6d6d6d" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,2" opacity="0.6"/>

  <!-- 抽象数据点 - 象征信号帧 -->
  <g>
    <!-- 左侧数据点群 -->
    <circle cx="45" cy="60" r="3" fill="#a0a0a0" opacity="0.8">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="70" cy="140" r="2.5" fill="#909090" opacity="0.7">
      <animate attributeName="r" values="2.5;4;2.5" dur="2.5s" repeatCount="indefinite" begin="0.3s"/>
    </circle>

    <!-- 中间数据点群 -->
    <circle cx="110" cy="120" r="3.5" fill="#b0b0b0" opacity="0.9">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="3s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="130" cy="80" r="2" fill="#808080" opacity="0.6">
      <animate attributeName="r" values="2;4;2" dur="2.2s" repeatCount="indefinite" begin="0.9s"/>
    </circle>

    <!-- 右侧数据点群 -->
    <circle cx="160" cy="140" r="3" fill="#a0a0a0" opacity="0.8">
      <animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <circle cx="170" cy="80" r="2.5" fill="#909090" opacity="0.7">
      <animate attributeName="r" values="2.5;4.5;2.5" dur="3.2s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>

  <!-- 信号轨迹光晕 -->
  <path d="M30,100
           C40,60 50,60 60,60
           S80,80 90,140
           C100,160 110,160 120,120
           S130,80 140,100
           C150,120 160,120 170,80"
        fill="none" stroke="#e0e0e0" stroke-width="8" stroke-linecap="round" opacity="0.05"/>
</svg>
