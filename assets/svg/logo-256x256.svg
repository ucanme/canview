<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变线条 -->
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9e9e9e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#757575" stop-opacity="1"/>
      <stop offset="100%" stop-color="#9e9e9e" stop-opacity="0.8"/>
    </linearGradient>

    <!-- 艺术化画笔效果 -->
    <filter id="sketchFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.01" numOctaves="2" result="turbulence"/>
      <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- 示波器屏幕: 内容区 204x204 居中 (调小一点跟其他 macOS app 一致)
       margin: left=26, top=26, right=26, bottom=26, 占 204/256=79.7% -->
  <rect x="26" y="26" width="204" height="204" rx="36" fill="#1a1a1a" stroke="#4a4a4a" stroke-width="3"/>

  <!-- 艺术化网格背景 -->
  <g stroke="#3a3a3a" stroke-width="0.8" opacity="0.4">
    <!-- 水平线 -->
    <line x1="26" y1="77" x2="230" y2="77"/>
    <line x1="26" y1="128" x2="230" y2="128"/>
    <line x1="26" y1="179" x2="230" y2="179"/>
    <!-- 垂直线 -->
    <line x1="77" y1="26" x2="77" y2="230"/>
    <line x1="128" y1="26" x2="128" y2="230"/>
    <line x1="179" y1="26" x2="179" y2="230"/>
  </g>

  <!-- 主要艺术波形 -->
  <path d="M40,128
           C54,84 64,84 77,84
           S105,108 119,172
           C133,192 143,192 157,154
           S171,108 185,128
           C199,148 209,148 218,108"
        fill="none" stroke="url(#lineGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#sketchFilter)"/>

  <!-- 次要波形 -->
  <path d="M40,138
           C54,110 64,110 77,110
           S97,128 111,156
           C125,176 135,176 149,138
           S168,118 182,138
           C196,158 206,158 218,128"
        fill="none" stroke="#6d6d6d" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5,2" opacity="0.6"/>

  <!-- 抽象数据点 -->
  <g>
    <circle cx="62" cy="84" r="3.5" fill="#a0a0a0" opacity="0.8"/>
    <circle cx="95" cy="172" r="3" fill="#909090" opacity="0.7"/>
    <circle cx="148" cy="154" r="4" fill="#b0b0b0" opacity="0.9"/>
    <circle cx="171" cy="108" r="2.5" fill="#808080" opacity="0.6"/>
    <circle cx="208" cy="172" r="3.5" fill="#a0a0a0" opacity="0.8"/>
  </g>

  <!-- 信号轨迹光晕 -->
  <path d="M40,128
           C54,84 64,84 77,84
           S105,108 119,172
           C133,192 143,192 157,154
           S171,108 185,128
           C199,148 209,148 218,108"
        fill="none" stroke="#e0e0e0" stroke-width="9" stroke-linecap="round" opacity="0.05"/>
</svg>
