[package]
name = "viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
# runtime_shaders: build shaders at runtime (Rust) instead of via xcrun metal,
# so the crate builds without full Xcode. CI uses full Xcode and ignores this.
gpui = { git = "https://github.com/zed-industries/zed", features = ["runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
anyhow = "1.0"
blf = { path = "../blf" }
parser = { path = "../parser" }
chrono = "0.4" # For timestamp formatting
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
tokio = { version = "1.0", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1.0", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2.1"
smol = "2"
if-addrs = "0.13"

# Platform-specific file dialog backend
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.14", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.14", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.14", default-features = false, features = ["tokio", "xdg-portal"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[[bin]]
name = "viewer"
path = "src/main.rs"

# Windows 配置：隐藏控制台窗口
[profile.release]
strip = true  # 减小文件大小

# Windows 特定配置
[package.metadata.winres]
OriginalFilename = "can-viewer.exe"
ProductName = "can-viewer"
FileDescription = "CAN/LIN Bus Analysis Tool"
