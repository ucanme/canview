name: Build Multi-Platform Binaries

on:
  push:
    branches: [ main, dev, 'feat/**' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM (Apple Silicon) — builds a .app bundle so the
          # canview icon shows in Dock and Cmd-Tab. Uses nightly because
          # the project depends on edition 2024 + #![recursion_limit].
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: canview.app
            asset_name: canview-macos-aarch64

          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: view
            asset_name: canview-linux-x86_64

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: view.exe
            asset_name: canview-windows-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
          components: rustfmt, clippy
          # Edition 2024 was stabilized in Rust 1.85 (Feb 2025);
          # `#![recursion_limit]` has been stable since 1.0. Stable Rust
          # is sufficient. We previously used nightly for edition-2024
          # support, but recent nightlies removed `simd_fmin`/`simd_fmax`
          # intrinsics, which breaks pathfinder_simd 0.5.5 (a transitive
          # dep of gpui via pathfinder_geometry). Staying on stable
          # avoids that.

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lld \
            clang \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxkbcommon-x11-dev \
            libxcb-xkb-dev \
            libwayland-dev \
            libvulkan-dev \
            libx11-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            fontconfig \
            xdg-desktop-portal \
            xdg-desktop-portal-gtk \
            libgtk-3-dev \
            libasound2-dev


      - name: Show Rust version
        run: |
          rustc --version
          cargo --version

      - name: Run cargo check
        run: cargo check --target ${{ matrix.target }} -p view

      - name: Run cargo clippy
        if: matrix.os != 'windows-latest'
        run: cargo clippy --target ${{ matrix.target }} -p view -- -W clippy::all

      - name: Build release binary (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          # Detailed library verification
          echo "=== Checking for xkbcommon libraries ==="
          dpkg -L libxkbcommon-x11-0 | grep "\.so" || echo "No .so files found in libxkbcommon-x11-0"
          dpkg -L libxkbcommon-x11-dev | grep "\.so" || echo "No .so files found in libxkbcommon-x11-dev"
          
          echo "=== Searching for library files ==="
          find /usr/lib -name "libxkbcommon*.so*" 2>/dev/null || echo "No libxkbcommon files found"
          
          echo "=== Checking pkg-config ==="
          pkg-config --exists xkbcommon-x11 && echo "xkbcommon-x11 found by pkg-config" || echo "xkbcommon-x11 NOT found by pkg-config"
          pkg-config --libs xkbcommon-x11 || echo "Failed to get libs"
          pkg-config --cflags xkbcommon-x11 || echo "Failed to get cflags"
          
          echo "=== Checking ldconfig cache ==="
          ldconfig -p | grep xkbcommon || echo "xkbcommon not in ldconfig cache"
          
          # Set up environment for Rust linker
          export LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LIBRARY_PATH
          export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
          export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH
          
          # Use pkg-config to get the correct linker flags
          if pkg-config --exists xkbcommon-x11; then
            XKBCOMMON_LIBS=$(pkg-config --libs xkbcommon-x11)
            echo "Using pkg-config libs: $XKBCOMMON_LIBS"
            export RUSTFLAGS="-L /usr/lib/x86_64-linux-gnu -C link-args=$XKBCOMMON_LIBS $RUSTFLAGS"
          else
            echo "WARNING: pkg-config cannot find xkbcommon-x11, using fallback"
            export RUSTFLAGS="-L /usr/lib/x86_64-linux-gnu -L /usr/lib $RUSTFLAGS"
          fi
          
          echo "=== Final RUSTFLAGS: $RUSTFLAGS ==="
          
          cargo build --release -p view --target ${{ matrix.target }}

      - name: Build release binary (Non-Ubuntu)
        if: "!startsWith(matrix.os, 'ubuntu')"
        run: cargo build --release -p view --target ${{ matrix.target }}

      - name: Strip binary (Linux)
        if: runner.os == 'Linux'
        run: strip target/${{ matrix.target }}/release/view || true

      - name: Regenerate can-viewer.icns from PNG sources (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          ICONSET=/tmp/can-viewer.iconset
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          sips -z 16 16 assets/png/logo_16.png --out "$ICONSET/icon_16x16.png" > /dev/null
          sips -z 32 32 assets/png/logo_32.png --out "$ICONSET/icon_16x16@2x.png" > /dev/null
          sips -z 32 32 assets/png/logo_32.png --out "$ICONSET/icon_32x32.png" > /dev/null
          sips -z 64 64 assets/png/logo_64.png --out "$ICONSET/icon_32x32@2x.png" > /dev/null
          sips -z 128 128 assets/png/logo_128.png --out "$ICONSET/icon_128x128.png" > /dev/null
          sips -z 256 256 assets/png/logo_256.png --out "$ICONSET/icon_128x128@2x.png" > /dev/null
          sips -z 256 256 assets/png/logo_256.png --out "$ICONSET/icon_256x256.png" > /dev/null
          sips -z 512 512 assets/png/logo_512.png --out "$ICONSET/icon_256x256@2x.png" > /dev/null
          sips -z 512 512 assets/png/logo_512.png --out "$ICONSET/icon_512x512.png" > /dev/null
          sips -z 1024 1024 assets/png/logo_512.png --out "$ICONSET/icon_512x512@2x.png" > /dev/null
          iconutil -c icns "$ICONSET" -o assets/ico/can-viewer.icns
          echo "Regenerated can-viewer.icns from PNG sources"

      # macOS: wrap the binary in a .app bundle so the canview icon shows
      # in Dock and Cmd-Tab. The bundle includes Info.plist + can-viewer.icns.
      - name: Create .app bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          # Derive version from git tag (e.g. "v0.1.0" -> "0.1.0").
          # Falls back to "0.0.0" if git is unavailable or no tags exist.
          VERSION="$(git describe --tags --always 2>/dev/null || echo "0.0.0")"
          # Strip leading "v" and any "-N-gabc" / "-dirty" suffix for the
          # plist short version string (must be x.y[.z]).
          VERSION_SHORT="$(echo "$VERSION" | sed -E 's/^v//; s/-.*//')"
          echo "canview version: $VERSION (short: $VERSION_SHORT)"

          APP_DIR=target/${{ matrix.target }}/release/canview.app
          CONTENTS="$APP_DIR/Contents"
          MACOS_DIR="$CONTENTS/MacOS"
          RESOURCES_DIR="$CONTENTS/Resources"
          mkdir -p "$MACOS_DIR" "$RESOURCES_DIR"
          cp target/${{ matrix.target }}/release/view "$MACOS_DIR/canview"
          chmod +x "$MACOS_DIR/canview"
          cp assets/ico/can-viewer.icns "$RESOURCES_DIR/can-viewer.icns"
          # Write Info.plist without indentation (plist parser is strict
          # about leading whitespace; printf gives full control).
          {
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
            printf '%s\n' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            printf '%s\n' '<plist version="1.0">'
            printf '%s\n' '<dict>'
            printf '%s\n' '  <key>CFBundleDevelopmentRegion</key><string>en</string>'
            printf '%s\n' '  <key>CFBundleExecutable</key><string>canview</string>'
            printf '%s\n' '  <key>CFBundleIdentifier</key><string>com.canview.app</string>'
            printf '%s\n' '  <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>'
            printf '%s\n' '  <key>CFBundleName</key><string>canview</string>'
            printf '%s\n' '  <key>CFBundlePackageType</key><string>APPL</string>'
            printf '%s\n' "  <key>CFBundleShortVersionString</key><string>${VERSION_SHORT}</string>"
            printf '%s\n' "  <key>CFBundleVersion</key><string>${VERSION_SHORT}</string>"
            printf '%s\n' '  <key>LSMinimumSystemVersion</key><string>10.13</string>'
            printf '%s\n' '  <key>NSHighResolutionCapable</key><true/>'
            printf '%s\n' '  <key>CFBundleIconFile</key><string>canview</string>'
            printf '%s\n' '</dict>'
            printf '%s\n' '</plist>'
          } > "$CONTENTS/Info.plist"

      - name: Prepare upload directory
        shell: bash
        run: |
          mkdir -p upload

      - name: Copy binary (Linux)
        if: runner.os == 'Linux'
        run: |
          cp target/${{ matrix.target }}/release/view upload/${{ matrix.artifact_name }}
          chmod +x upload/${{ matrix.artifact_name }}

      - name: Copy .app bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cp -R target/${{ matrix.target }}/release/canview.app upload/

      - name: Copy binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/view.exe upload/${{ matrix.artifact_name }}

      - name: Create archive (Linux)
        if: runner.os == 'Linux'
        run: |
          cd upload
          tar czf ../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Create archive (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd upload
          tar czf ../${{ matrix.asset_name }}.tar.gz canview.app

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd upload
          7z a -tzip ../${{ matrix.asset_name }}.zip ${{ matrix.artifact_name }}

      - name: Upload artifact (Unix-like)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            upload/${{ matrix.artifact_name }}
            upload/canview.app
          retention-days: 30

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip
          retention-days: 30

      - name: Upload to release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
